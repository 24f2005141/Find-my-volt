version: '3.8'

services:
  find-my-volt-backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    container_name: find_my_volt_api
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
    volumes:
      # Persistent volume for SQLite database storage
      - volt_db_data:/app/backend/database

volumes:
  volt_db_data:
    driver: local
