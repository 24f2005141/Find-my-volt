AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Find My Volt - Production AWS Free Tier Deployment Template
  Deploys the SQLite database and Python REST API server on an Amazon EC2 t2.micro / t3.micro instance
  with a 30 GB gp3 persistent EBS volume (100% covered under the 12-Month AWS Free Tier).

Parameters:
  InstanceType:
    Type: String
    Default: t2.micro
    AllowedValues:
      - t2.micro
      - t3.micro
      - t4g.micro
    Description: EC2 Instance Type eligible for AWS Free Tier (750 hours/month free).

  KeyName:
    Type: String
    Default: ''
    Description: (Optional) Name of an existing EC2 KeyPair to enable SSH access.

  LatestAmiId:
    Type: 'AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>'
    Default: '/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64'
    Description: Automatically fetches the latest official Amazon Linux 2023 AMI for the selected region.

Resources:
  # -------------------------------------------------------------
  # Networking: VPC, Internet Gateway, Subnet, Route Table
  # -------------------------------------------------------------
  VoltVPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: FindMyVolt-VPC

  VoltInternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: FindMyVolt-IGW

  VoltVPCGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VoltVPC
      InternetGatewayId: !Ref VoltInternetGateway

  VoltPublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VoltVPC
      CidrBlock: 10.0.1.0/24
      MapPublicIpOnLaunch: true
      AvailabilityZone: !Select [0, !GetAZs '']
      Tags:
        - Key: Name
          Value: FindMyVolt-PublicSubnet

  VoltRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VoltVPC
      Tags:
        - Key: Name
          Value: FindMyVolt-PublicRouteTable

  VoltPublicRoute:
    Type: AWS::EC2::Route
    DependsOn: VoltVPCGatewayAttachment
    Properties:
      RouteTableId: !Ref VoltRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref VoltInternetGateway

  VoltSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref VoltPublicSubnet
      RouteTableId: !Ref VoltRouteTable

  # -------------------------------------------------------------
  # Security Group (HTTP 80, API 5000, SSH 22)
  # -------------------------------------------------------------
  VoltSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for Find My Volt API Backend and Database
      VpcId: !Ref VoltVPC
      SecurityGroupIngress:
        # Standard HTTP
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
          Description: Allow public HTTP traffic
        # Backend API direct port
        - IpProtocol: tcp
          FromPort: 5000
          ToPort: 5000
          CidrIp: 0.0.0.0/0
          Description: Allow direct Find My Volt API traffic
        # SSH access
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0
          Description: Allow SSH management
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
          Description: Allow all outbound traffic
      Tags:
        - Key: Name
          Value: FindMyVolt-SecurityGroup

  # -------------------------------------------------------------
  # EC2 Free Tier Instance with Persistent EBS Storage
  # -------------------------------------------------------------
  VoltInstance:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: !Ref InstanceType
      ImageId: !Ref LatestAmiId
      SubnetId: !Ref VoltPublicSubnet
      SecurityGroupIds:
        - !Ref VoltSecurityGroup
      KeyName: !If [HasKeyName, !Ref KeyName, !Ref 'AWS::NoValue']
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: 30 # 30 GB Free Tier maximum
            VolumeType: gp3
            DeleteOnTermination: false # Preserve database storage on termination
            Encrypted: true
      Tags:
        - Key: Name
          Value: FindMyVolt-Backend-FreeTier
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -e

          # Update system & install Python 3, SQLite
          dnf update -y
          dnf install -y python3 python3-pip sqlite iptables-services

          # Configure iptables to port-forward port 80 -> port 5000
          iptables -t nat -A PREROUTING -p tcp --dport 80 -j REDIRECT --to-port 5000
          iptables-save > /etc/sysconfig/iptables || true
          systemctl enable iptables || true
          systemctl start iptables || true

          # Create app directory
          mkdir -p /opt/find-my-volt
          cd /opt/find-my-volt

          # Extract complete backend payload
          cat << 'PAYLOAD_EOF' | base64 -d | tar -xz -C /opt/find-my-volt
