          PAYLOAD_EOF

          # Create systemd service
          cat << 'EOF' > /etc/systemd/system/find-my-volt.service
          [Unit]
          Description=Find My Volt REST API Server Daemon
          After=network.target

          [Service]
          Type=simple
          User=root
          WorkingDirectory=/opt/find-my-volt
          ExecStart=/usr/bin/python3 /opt/find-my-volt/backend/server.py
          Restart=always
          RestartSec=5
          Environment=PORT=5000

          [Install]
          WantedBy=multi-user.target
          EOF

          # Enable and start daemon
          systemctl daemon-reload
          systemctl enable find-my-volt.service
          systemctl start find-my-volt.service

Conditions:
  HasKeyName: !Not [!Equals [!Ref KeyName, '']]

Outputs:
  InstanceId:
    Description: Instance ID of the deployed EC2 Free Tier Server
    Value: !Ref VoltInstance

  PublicIp:
    Description: Public IPv4 Address
    Value: !GetAtt VoltInstance.PublicIp

  BackendApiUrl:
    Description: Direct REST API Base URL
    Value: !Sub 'http://${VoltInstance.PublicIp}:5000/api'

  StandardHttpApiUrl:
    Description: Standard Port 80 HTTP API Base URL
    Value: !Sub 'http://${VoltInstance.PublicIp}/api'

  HealthCheckUrl:
    Description: Public Health Check URL
    Value: !Sub 'http://${VoltInstance.PublicIp}:5000/api/health'
